name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解压源码并定位工程目录
        run: |
          set -e
          mkdir -p proj
          if ls *.zip >/dev/null 2>&1; then
            unzip -q "$(ls *.zip | head -n1)" -d raw
          else
            mkdir -p raw
          fi
          ROOT=$(find raw -name 'settings.gradle.kts' -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "::error::没有找到 settings.gradle.kts，请确认上传的 zip 里是完整工程"
            exit 1
          fi
          echo "找到工程目录：$ROOT"
          cp -a "$ROOT/." proj/
          ls proj

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 配置 Android SDK
        run: |
          set -e
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > proj/local.properties
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 编译 Debug APK
        run: |
          set -e
          cd proj
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaReader-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
